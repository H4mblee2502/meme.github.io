<!DOCTYPE html>
<html lang="en">
<head>
    <style>
body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
img{
    margin-bottom: -100px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.question{
    max-width: 50%;
    line-height: 1.4;
    font-size: 1.2rem;
    font-weight: bold;
    text-align: center;
}
.answer{
    font-weight: normal;
    font-size: 0.9rem;
    color: rgba(189, 189, 189, 1);
    margin: 0.6rem 0 2rem 0;
    display: block;

}
.loading {
    width: 35px;
    height: 35px;
    border:  5px solid rgba(189,189,189 ,0.25);
    border-left-color: rgba(3,155,229 ,1);
    border-top-color: rgba(3,155,229 ,1);
    border-radius: 50%;
    display: inline-block;
    animation: rotate 600ms infinite linear;
}
@keyframes rotate{
    to{
        transform: rotate(1turn);
    }
}
@media(max-width: 500px){
    .question{
    position: fixed;;
    }
    img{
        margin: 0;
        width: 250px;
        height: 250px;
    }
}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Screen</title>
    
</head>
<body>
    <section class="question">
       <div><img src="scuba.gif" alt="cats" height="550px" width="520px"></div>
        What do you call a sick eagle?

        <span class="answer">illegal.</span>
        <spa class="loading"></spa>
    </section>

    
</body>
</html>
